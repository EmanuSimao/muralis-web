services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "5432:5432"
    
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: muralis

    volumes: 
      - pg-data:/var/lib/postgresql/data

    healthcheck:
      test: pg_isready -U user -d muralis
      interval: 5s


  frontend:
    build: ./frontend
    ports: 
      - "5173:5173"
    volumes:
      - ./frontend:/src
      - /src/node_modules
    restart: unless-stopped

  volumes:
    pg-data:
      external: true
